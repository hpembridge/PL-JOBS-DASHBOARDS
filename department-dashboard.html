<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Department Jobs — Active Jobs Dashboards</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="shared/css/design-tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=optional"
    rel="stylesheet">
  <link rel="stylesheet" href="customer-management.css" />
  <link rel="stylesheet" href="jobs-dashboard.css" />
</head>

<body data-theme="titanium">
  <div class="main">

    <!-- ── TOP BAR ── -->
    <div class="topbar">
      <div class="breadcrumb type-body-sm">
        <a href="index.html"><i class="fa-regular fa-folder"></i> Jobs Dashboards</a>
        <span class="sep">›</span>
        <span class="current">Department Jobs</span>
      </div>
    </div>

    <!-- ── PAGE CONTENT ── -->
    <div class="page-content">

      <div class="viewing-as">
        <label for="dept-select">Department</label>
        <select id="dept-select" onchange="onDeptChange()"></select>
      </div>
      <div class="dept-meta" id="dept-meta"></div>

      <!-- Toolbar -->
      <div class="jobs-toolbar">
        <div class="toolbar-actions">
          <div class="pill-filter-row" id="pill-row"></div>
        </div>
        <div class="toolbar-right">
          <button class="pill-filter-clear" id="toggle-empty" onclick="toggleEmptyStops()"></button>
          <button class="pill-filter-clear" id="clear-pills" onclick="clearPillFilter()" style="display:none">Clear filters</button>
        </div>
      </div>

      <!-- Table -->
      <div class="card" style="display:block;">
        <div class="search-list-header">
          <input id="search-input" placeholder="Search department jobs..." />
        </div>
        <table class="jobs-table">
          <colgroup>
            <col class="col-job">
            <col class="col-desc">
            <col class="col-client">
            <col class="col-loc">
            <col class="col-prod">
            <col class="col-type">
            <col class="col-date">
          </colgroup>
          <thead>
            <tr>
              <th class="col-job">Job #</th>
              <th class="col-desc">Description</th>
              <th class="col-client">Client</th>
              <th class="col-loc">Scan Location</th>
              <th class="col-prod">Production Type</th>
              <th class="col-type">Job Type</th>
              <th class="th-date">Created</th>
            </tr>
          </thead>
          <tbody id="jobs-tbody"></tbody>
        </table>
        <div class="jobs-empty" id="jobs-empty" style="display:none">No jobs match the current filters.</div>
      </div>

    </div><!-- /page-content -->
  </div><!-- /main -->

  <div class="toast" id="toast"></div>

  <script src="mock-data.js"></script>
  <script>
    let currentDept = null;
    let activePillDescs = new Set();
    let showEmptyStops = false;

    function initDeptSelect() {
      const sel = document.getElementById('dept-select');
      sel.innerHTML = DEPARTMENTS.map(d => `<option value="${d.desc}">${d.desc}</option>`).join('');
      currentDept = DEPARTMENTS[0];
      render();
    }

    function onDeptChange() {
      const desc = document.getElementById('dept-select').value;
      currentDept = DEPARTMENTS.find(d => d.desc === desc);
      activePillDescs = new Set();
      showEmptyStops = false;
      render();
    }

    function togglePill(desc) {
      if (activePillDescs.has(desc)) activePillDescs.delete(desc);
      else activePillDescs.add(desc);
      renderTable();
      renderPills();
    }

    function clearPillFilter() {
      activePillDescs = new Set();
      renderTable();
      renderPills();
    }

    // Departments like Creative Services and Bindery have 40+ scan locations,
    // most of them empty at any given moment. Empty stops collapse behind a
    // toggle so the pill row stays scannable.
    function toggleEmptyStops() {
      showEmptyStops = !showEmptyStops;
      renderPills();
    }

    function rowPillClass(desc) {
      if (/proof out/i.test(desc)) return 'row-pill is-proof-out';
      if (/shipped|billed/i.test(desc)) return 'row-pill is-shipped';
      return 'row-pill';
    }

    function jobsForDept() {
      return JOBS.filter(j => j.dept === currentDept.desc);
    }

    function renderPills() {
      const jobs = jobsForDept();
      const counts = {};
      currentDept.locations.forEach(loc => {
        counts[loc.desc] = jobs.filter(j => j.location === loc.desc).length;
      });

      const emptyCount = currentDept.locations.filter(loc => !counts[loc.desc]).length;
      const visible = currentDept.locations.filter(loc =>
        showEmptyStops || counts[loc.desc] || activePillDescs.has(loc.desc)
      );

      const row = document.getElementById('pill-row');
      row.innerHTML = visible.map(loc => {
        const active = activePillDescs.has(loc.desc) ? ' active' : '';
        const empty = counts[loc.desc] ? '' : ' is-empty';
        return `<button class="pill-filter${active}${empty}" onclick="togglePill('${loc.desc.replace(/'/g, "\\'")}')">${loc.desc}<span class="pill-count">${counts[loc.desc]}</span></button>`;
      }).join('');

      const toggle = document.getElementById('toggle-empty');
      if (emptyCount === 0) {
        toggle.style.display = 'none';
      } else {
        toggle.style.display = '';
        toggle.textContent = showEmptyStops
          ? 'Hide ' + emptyCount + ' empty stops'
          : 'Show ' + emptyCount + ' empty stops';
      }

      document.getElementById('clear-pills').style.display = activePillDescs.size ? '' : 'none';
    }

    function renderTable() {
      const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
      const tbody = document.getElementById('jobs-tbody');
      const jobs = jobsForDept().filter(j => {
        const pillMatch = activePillDescs.size === 0 || activePillDescs.has(j.location);
        const searchMatch = !q || j.desc.toLowerCase().includes(q) || String(j.job).includes(q) || j.client.toLowerCase().includes(q);
        return pillMatch && searchMatch;
      });

      tbody.innerHTML = jobs.map(j => `
        <tr onclick="goToJob(${j.job})">
          <td class="td-job">${j.job}</td>
          <td class="td-desc">${j.desc}</td>
          <td>${j.client}</td>
          <td><span class="${rowPillClass(j.location)}">${j.location}</span></td>
          <td>${j.prodType}</td>
          <td>${j.jobType}</td>
          <td class="td-date">${j.date}</td>
        </tr>
      `).join('');

      document.getElementById('jobs-empty').style.display = jobs.length === 0 ? '' : 'none';
    }

    function render() {
      document.getElementById('dept-meta').textContent = 'One shared board for the whole department — every scan location under ' + currentDept.desc + ' is a filter pill.';
      renderPills();
      renderTable();
    }

    function goToJob(jobNum) {
      showToast('Opening job #' + jobNum + '…');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = '→  ' + msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    document.getElementById('search-input').addEventListener('input', renderTable);

    initDeptSelect();
  </script>
</body>

</html>
