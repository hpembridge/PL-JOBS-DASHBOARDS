<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Department Jobs — Active Jobs Dashboards</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="shared/css/design-tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=optional"
    rel="stylesheet">
  <link rel="stylesheet" href="customer-management.css" />
  <link rel="stylesheet" href="jobs-dashboard.css" />
</head>

<body data-theme="titanium">
  <div class="main">

    <!-- ── TOP BAR ── -->
    <div class="topbar">
      <div class="breadcrumb type-body-sm">
        <a href="index.html"><i class="fa-regular fa-folder"></i> Jobs Dashboards</a>
        <span class="sep">›</span>
        <span class="current">Department Jobs</span>
      </div>
    </div>

    <!-- ── PAGE CONTENT ── -->
    <div class="page-content">

      <div class="viewing-as">
        <label for="dept-select">Department</label>
        <select id="dept-select" onchange="onDeptChange()"></select>
      </div>

      <div class="board-toolbar">
        <div class="search-container">
          <i class="fa-regular fa-magnifying-glass"></i>
          <input type="text" id="search-input" class="search-input" placeholder="Search department jobs..." autocomplete="off" />
        </div>
        <div class="toolbar-right">
          <button class="text-btn" id="toggle-empty" onclick="toggleAllEmpty()"></button>
        </div>
      </div>
      <div class="legend" id="legend"></div>

      <!-- ── BOARD ── -->
      <div class="kanban" id="kanban"></div>

    </div><!-- /page-content -->
  </div><!-- /main -->

  <div class="toast" id="toast"></div>

  <script src="mock-data.js"></script>
  <script>
    let currentDept = null;
    const expandedLanes = new Set();
    let allEmptyExpanded = false;

    function initDeptSelect() {
      const sel = document.getElementById('dept-select');
      sel.innerHTML = DEPARTMENTS.map(d => `<option value="${d.desc}">${d.desc}</option>`).join('');
      currentDept = DEPARTMENTS[0];
      document.getElementById('legend').innerHTML = legendHTML();
      render();
    }

    function onDeptChange() {
      currentDept = DEPARTMENTS.find(d => d.desc === document.getElementById('dept-select').value);
      expandedLanes.clear();
      allEmptyExpanded = false;
      render();
    }

    function toggleLane(key) {
      if (expandedLanes.has(key)) expandedLanes.delete(key);
      else expandedLanes.add(key);
      renderBoard();
    }

    // Bulk expand/collapse for the empty stops. Bindery has 40 locations and
    // Creative 46, most of them empty at any given moment, so the default is
    // collapsed and this opens them all at once when someone needs to scan.
    function toggleAllEmpty() {
      allEmptyExpanded = !allEmptyExpanded;
      const keys = buildLanes(deptJobs()).map(l => l.key);
      expandedLanes.clear();
      if (allEmptyExpanded) keys.forEach(k => expandedLanes.add(k));
      renderBoard();
    }

    function deptJobs() {
      const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
      return JOBS.filter(j => j.dept === currentDept.desc && (
        !q || j.desc.toLowerCase().includes(q) || String(j.job).includes(q) ||
        j.customer.toLowerCase().includes(q) || j.mgmtGroup.toLowerCase().includes(q)
      ));
    }

    // Build the lane list for the current department.
    //
    // Most departments get one lane per scan location — including stops owned by
    // a named individual, since a department lead needs to see those too.
    //
    // Creative Services is the exception. Its 46 stops are mostly individual
    // designers and their proof-out queues, which made for a 40-lane board. So
    // it shows only the shared stops as lanes, then rolls every designer stop
    // into one combined Working lane and one combined Proof Out lane, with the
    // actual scan location on each card as a pill.
    //
    // Press gets a smaller version of the same treatment: Mike, Barry, David
    // and Kristen M's individual "-Plated" stops combine into one Plated lane.
    //
    // Pre-Press gets it too: its individual proof-out queues (Mix Master Mike,
    // Money Mitch, Da Barons, DJ Skittles) combine into one Proof Out lane.
    // In both cases the actual stop is shown as a pill on each card.
    //
    // matchFn decides which of the department's locations get folded into the
    // single combined lane (matchTitle); everything else keeps its own lane.
    function combinedLanes(jobs, matchFn, matchKey, matchTitle) {
      const byLoc = {};
      jobs.forEach(j => { (byLoc[j.location] = byLoc[j.location] || []).push(j); });

      const lanes = [];
      let combinedAdded = false;
      currentDept.locations.forEach(loc => {
        if (matchFn(loc.desc)) {
          if (!combinedAdded) {
            lanes.push({
              key: matchKey, title: matchTitle,
              jobs: jobs.filter(j => matchFn(j.location)),
              opts: { showLocation: true },
            });
            combinedAdded = true;
          }
          return;
        }
        lanes.push({ key: loc.desc, title: loc.desc, jobs: byLoc[loc.desc] || [], opts: {} });
      });
      return lanes;
    }

    function buildLanes(jobs) {
      const byLoc = {};
      jobs.forEach(j => { (byLoc[j.location] = byLoc[j.location] || []).push(j); });

      if (currentDept.desc === CREATIVE_DEPT) {
        const lanes = CREATIVE_SHARED_STOPS
          .filter(desc => currentDept.locations.some(l => l.desc === desc))
          .map(desc => ({ key: desc, title: desc, jobs: byLoc[desc] || [], opts: {} }));

        const rolled = proofOut => jobs.filter(j =>
          !isCreativeSharedStop(j.location) && isProofOutStop(j.location) === proofOut
        );

        lanes.push({ key: '__working__',  title: 'Working',   jobs: rolled(false), opts: { showLocation: true } });
        lanes.push({ key: '__proofout__', title: 'Proof Out', jobs: rolled(true),  opts: { showLocation: true } });
        return lanes;
      }

      if (currentDept.desc === PRESS_DEPT) {
        return combinedLanes(jobs, isPressPlatedStop, '__plated__', 'Plated');
      }

      if (currentDept.desc === PRE_PRESS_DEPT) {
        return combinedLanes(jobs, isProofOutStop, '__proofout__', 'Proof Out');
      }

      return currentDept.locations.map(loc => ({
        key: loc.desc, title: loc.desc, jobs: byLoc[loc.desc] || [], opts: {},
      }));
    }

    function renderBoard() {
      const lanes = buildLanes(deptJobs());

      document.getElementById('kanban').innerHTML = lanes.map(l =>
        laneHTML(l.key, l.title, l.jobs, expandedLanes, l.opts)
      ).join('');

      const emptyCount = lanes.filter(l => !l.jobs.length).length;
      const btn = document.getElementById('toggle-empty');
      if (!emptyCount) {
        btn.style.display = 'none';
      } else {
        btn.style.display = '';
        btn.textContent = allEmptyExpanded
          ? 'Collapse ' + emptyCount + ' empty stops'
          : 'Expand ' + emptyCount + ' empty stops';
      }
    }

    function render() {
      renderBoard();
    }

    function goToJob(jobNum) { showToast('Opening job #' + jobNum + '…'); }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = '→  ' + msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    document.getElementById('search-input').addEventListener('input', renderBoard);
    initDeptSelect();
  </script>
</body>

</html>
