<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Clients' Active Jobs — Active Jobs Dashboards</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="shared/css/design-tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=optional"
    rel="stylesheet">
  <link rel="stylesheet" href="customer-management.css" />
  <link rel="stylesheet" href="jobs-dashboard.css" />
</head>

<body data-theme="titanium">
  <div class="main">

    <!-- ── TOP BAR ── -->
    <div class="topbar">
      <div class="breadcrumb type-body-sm">
        <a href="index.html"><i class="fa-regular fa-folder"></i> Jobs Dashboards</a>
        <span class="sep">›</span>
        <span class="current">My Clients' Active Jobs</span>
      </div>
    </div>

    <!-- ── PAGE CONTENT ── -->
    <div class="page-content">

      <div class="viewing-as">
        <label for="rep-select">Viewing as</label>
        <select id="rep-select" onchange="onRepChange()"></select>
      </div>

      <div class="board-toolbar">
        <div class="search-container">
          <i class="fa-regular fa-magnifying-glass"></i>
          <input type="text" id="search-input" class="search-input" placeholder="Search my clients' jobs..." autocomplete="off" />
        </div>
      </div>
      <div class="legend" id="legend"></div>

      <!-- ── BOARD ── -->
      <div class="kanban" id="kanban"></div>

    </div><!-- /page-content -->
  </div><!-- /main -->

  <div class="toast" id="toast"></div>

  <script src="mock-data.js"></script>
  <script>
    let currentRep = null;
    const expandedLanes = new Set();

    function initRepSelect() {
      const sel = document.getElementById('rep-select');
      sel.innerHTML = SALES_REPS.map(r => `<option value="${r.name}">${r.name}</option>`).join('');
      currentRep = SALES_REPS[0];
      document.getElementById('legend').innerHTML = legendHTML();
      render();
    }

    function onRepChange() {
      currentRep = SALES_REPS.find(r => r.name === document.getElementById('rep-select').value);
      expandedLanes.clear();
      render();
    }

    function toggleLane(key) {
      if (expandedLanes.has(key)) expandedLanes.delete(key);
      else expandedLanes.add(key);
      renderBoard();
    }

    // Lanes are the DEPARTMENT each job's current scan location belongs to, so
    // a rep can see how much of their book is in art vs. on the floor vs.
    // ready to ship. Ordered by the shop's own department numbering, with
    // department-less stops last.
    function laneOrder() {
      return Object.keys(DEPT_SHORT_NAME).map(d => DEPT_SHORT_NAME[d]).concat([UNASSIGNED_DEPT]);
    }

    function renderBoard() {
      const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
      const mine = JOBS.filter(j => j.rep === currentRep.name && (
        !q || j.desc.toLowerCase().includes(q) || String(j.job).includes(q) ||
        j.customer.toLowerCase().includes(q) || j.mgmtGroup.toLowerCase().includes(q)
      ));

      const byDept = {};
      mine.forEach(j => { (byDept[j.deptLabel] = byDept[j.deptLabel] || []).push(j); });

      // Only show departments this rep actually has work in — a sales rep
      // doesn't need an empty Office lane on their board.
      const lanes = laneOrder().filter(label => byDept[label] || expandedLanes.has(label));

      document.getElementById('kanban').innerHTML = lanes.length
        // Lanes are departments, so each card carries its actual scan location.
        ? lanes.map(label => laneHTML(label, label, byDept[label] || [], expandedLanes, { showLocation: true })).join('')
        : '<div class="board-empty">No active jobs match this search.</div>';
    }

    function render() {
      renderBoard();
    }

    function goToJob(jobNum) { showToast('Opening job #' + jobNum + '…'); }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = '→  ' + msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    document.getElementById('search-input').addEventListener('input', renderBoard);
    initRepSelect();
  </script>
</body>

</html>
