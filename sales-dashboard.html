<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Clients' Active Jobs — Active Jobs Dashboards</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="shared/css/design-tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=optional"
    rel="stylesheet">
  <link rel="stylesheet" href="shared/customer-management.css" />
  <link rel="stylesheet" href="jobs-dashboard.css" />
</head>

<body data-theme="titanium">
  <div class="main">

    <!-- ── TOP BAR ── -->
    <div class="topbar">
      <div class="breadcrumb type-body-sm">
        <a href="index.html"><i class="fa-regular fa-folder"></i> Jobs Dashboards</a>
        <span class="sep">›</span>
        <span class="current">My Clients' Active Jobs</span>
      </div>
    </div>

    <!-- ── PAGE CONTENT ── -->
    <div class="page-content">

      <div class="viewing-as">
        <label for="rep-select">Viewing as</label>
        <select id="rep-select" onchange="onRepChange()"></select>
      </div>
      <div class="dept-meta" id="rep-meta"></div>

      <!-- Toolbar -->
      <div class="jobs-toolbar">
        <div class="toolbar-actions">
          <div class="pill-filter-row" id="pill-row"></div>
        </div>
        <button class="pill-filter-clear" id="clear-pills" onclick="clearPillFilter()" style="display:none">Clear filters</button>
      </div>

      <!-- Table -->
      <div class="card" style="display:block;">
        <div class="search-list-header">
          <input id="search-input" placeholder="Search my clients' jobs..." />
        </div>
        <table class="jobs-table">
          <colgroup>
            <col class="col-job">
            <col class="col-desc">
            <col class="col-client">
            <col class="col-loc">
            <col class="col-prod">
            <col class="col-type">
            <col class="col-date">
          </colgroup>
          <thead>
            <tr>
              <th class="col-job">Job #</th>
              <th class="col-desc">Description</th>
              <th class="col-client">Client</th>
              <th class="col-loc">Status</th>
              <th class="col-prod">Production Type</th>
              <th class="col-type">Job Type</th>
              <th class="th-date">Created</th>
            </tr>
          </thead>
          <tbody id="jobs-tbody"></tbody>
        </table>
        <div class="jobs-empty" id="jobs-empty" style="display:none">No jobs match the current filters.</div>
      </div>

    </div><!-- /page-content -->
  </div><!-- /main -->

  <div class="toast" id="toast"></div>

  <script src="mock-data.js"></script>
  <script>
    let currentRep = null;
    let activeClient = null;

    function initRepSelect() {
      const sel = document.getElementById('rep-select');
      sel.innerHTML = SALES_REPS.map(r => `<option value="${r.name}">${r.name}</option>`).join('');
      currentRep = SALES_REPS[0];
      render();
    }

    function onRepChange() {
      const name = document.getElementById('rep-select').value;
      currentRep = SALES_REPS.find(r => r.name === name);
      activeClient = null;
      render();
    }

    // Here the "filter pills" are the rep's client accounts, since sales
    // jobs are organized by client attachment rather than scan location.
    function toggleClient(client) {
      activeClient = (activeClient === client) ? null : client;
      renderTable();
      renderPills();
    }

    function clearPillFilter() {
      activeClient = null;
      renderTable();
      renderPills();
    }

    function rowPillClass(desc) {
      if (/proof out/i.test(desc)) return 'row-pill is-proof-out';
      if (/shipped|billed/i.test(desc)) return 'row-pill is-shipped';
      return 'row-pill';
    }

    function jobsForRep() {
      return JOBS.filter(j => j.rep === currentRep.name);
    }

    function renderPills() {
      const jobs = jobsForRep();
      const row = document.getElementById('pill-row');
      row.innerHTML = currentRep.clients.map(client => {
        const count = jobs.filter(j => j.client === client).length;
        const active = activeClient === client ? ' active' : '';
        return `<button class="pill-filter${active}" onclick="toggleClient('${client.replace(/'/g, "\\'")}')">${client}<span class="pill-count">${count}</span></button>`;
      }).join('');
      document.getElementById('clear-pills').style.display = activeClient ? '' : 'none';
    }

    function renderTable() {
      const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
      const tbody = document.getElementById('jobs-tbody');
      const jobs = jobsForRep().filter(j => {
        const clientMatch = !activeClient || j.client === activeClient;
        const searchMatch = !q || j.desc.toLowerCase().includes(q) || String(j.job).includes(q) || j.client.toLowerCase().includes(q);
        return clientMatch && searchMatch;
      });

      tbody.innerHTML = jobs.map(j => `
        <tr onclick="goToJob(${j.job})">
          <td class="td-job">${j.job}</td>
          <td class="td-desc">${j.desc}</td>
          <td>${j.client}</td>
          <td><span class="${rowPillClass(j.location)}">${j.location}</span></td>
          <td>${j.prodType}</td>
          <td>${j.jobType}</td>
          <td class="td-date">${j.date}</td>
        </tr>
      `).join('');

      document.getElementById('jobs-empty').style.display = jobs.length === 0 ? '' : 'none';
    }

    function render() {
      document.getElementById('rep-meta').textContent = 'Every active job across the client accounts attached to ' + currentRep.name + '. Pills filter by client, not by scan location.';
      renderPills();
      renderTable();
    }

    function goToJob(jobNum) {
      showToast('Opening job #' + jobNum + '…');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = '→  ' + msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    document.getElementById('search-input').addEventListener('input', renderTable);

    initRepSelect();
  </script>
</body>

</html>
