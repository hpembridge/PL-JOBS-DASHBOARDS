<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Active Jobs — Active Jobs Dashboards</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="shared/css/design-tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=optional"
    rel="stylesheet">
  <link rel="stylesheet" href="customer-management.css" />
  <link rel="stylesheet" href="jobs-dashboard.css" />
</head>

<body data-theme="titanium">
  <div class="main">

    <!-- ── TOP BAR ── -->
    <div class="topbar">
      <div class="breadcrumb type-body-sm">
        <a href="index.html"><i class="fa-regular fa-folder"></i> Jobs Dashboards</a>
        <span class="sep">›</span>
        <span class="current">My Active Jobs</span>
      </div>
    </div>

    <!-- ── PAGE CONTENT ── -->
    <div class="page-content">

      <div class="viewing-as">
        <label for="person-select">Viewing as</label>
        <select id="person-select" onchange="onPersonChange()"></select>
      </div>
      <div class="dept-meta" id="person-dept"></div>

      <div class="board-toolbar">
        <div class="search-container">
          <i class="fa-regular fa-magnifying-glass"></i>
          <input type="text" id="search-input" class="search-input" placeholder="Search my jobs..." autocomplete="off" />
        </div>
      </div>
      <div class="legend" id="legend"></div>

      <!-- ── BOARD ── -->
      <div class="kanban" id="kanban"></div>

    </div><!-- /page-content -->
  </div><!-- /main -->

  <div class="toast" id="toast"></div>

  <script src="mock-data.js"></script>
  <script>
    let currentPerson = null;
    const expandedLanes = new Set();   // lanes the user has manually opened

    function initPersonSelect() {
      const sel = document.getElementById('person-select');
      sel.innerHTML = PEOPLE.map(p => `<option value="${p.name}">${p.name} — ${p.deptLabel}</option>`).join('');
      currentPerson = PEOPLE[0];
      document.getElementById('legend').innerHTML = legendHTML();
      render();
    }

    function onPersonChange() {
      currentPerson = PEOPLE.find(p => p.name === document.getElementById('person-select').value);
      expandedLanes.clear();
      render();
    }

    function toggleLane(key) {
      if (expandedLanes.has(key)) expandedLanes.delete(key);
      else expandedLanes.add(key);
      renderBoard();
    }

    // Lanes are this person's own scan locations.
    function renderBoard() {
      const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
      const mine = JOBS.filter(j => j.person === currentPerson.name && (
        !q || j.desc.toLowerCase().includes(q) || String(j.job).includes(q) ||
        j.customer.toLowerCase().includes(q) || j.mgmtGroup.toLowerCase().includes(q)
      ));

      document.getElementById('kanban').innerHTML = currentPerson.locations.map(loc =>
        laneHTML(loc.desc, loc.label, mine.filter(j => j.location === loc.desc), expandedLanes)
      ).join('');
    }

    function render() {
      document.getElementById('person-dept').textContent =
        currentPerson.deptLabel + ' — jobs currently sitting at a scan location tied to ' + currentPerson.name + '.';
      renderBoard();
    }

    function goToJob(jobNum) { showToast('Opening job #' + jobNum + '…'); }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = '→  ' + msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    document.getElementById('search-input').addEventListener('input', renderBoard);
    initPersonSelect();
  </script>
</body>

</html>
